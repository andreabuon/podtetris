apiVersion: apps/v1
kind: Deployment
metadata:
  name: podtetris-webhook
  namespace: podtetris
  labels:
    app: podtetris-webhook
spec:
  replicas: 3
  selector:
    matchLabels:
      app: podtetris-webhook
  template:
    metadata:
      labels:
        app: podtetris-webhook
    spec:
      serviceAccountName: podtetris-webhook
      containers:
        - name: webhook
          image: podtetris-webhook:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8443
              name: https
          volumeMounts:
            - name: certs
              mountPath: /etc/webhook/certs
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: certs
          secret:
            secretName: podtetris-webhook-certs