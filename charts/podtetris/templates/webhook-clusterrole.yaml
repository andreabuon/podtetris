apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "podtetris.serviceAccountName" . }}-webhook
rules:
  - apiGroups: ["podtetris.io.podtetris.io"]
    resources: ["podmoves"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["podtetris.io.podtetris.io"]
    resources: ["podmoves/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "podtetris.serviceAccountName" . }}-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "podtetris.serviceAccountName" . }}-webhook
subjects:
  - kind: ServiceAccount
    name: {{ include "podtetris.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}