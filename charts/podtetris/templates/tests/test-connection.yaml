apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "podtetris.fullname" . }}-test-connection"
  labels:
    {{- include "podtetris.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: curl
      image: curlimages/curl:8.11.1
      command: ['curl']
      args:
        - -fsS
        - --insecure
        - https://{{ include "podtetris.fullname" . }}-webhook.{{ .Release.Namespace }}.svc:443/healthz
  restartPolicy: Never
