{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "podtetris.fullname" . }}-podmoves-writer
  labels:
    {{- include "podtetris.labels" . | nindent 4 }}
rules:
  - apiGroups: ["podtetris.io.podtetris.io"]
    resources: ["podmoves"]
    verbs: ["create", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "podtetris.fullname" . }}-podmoves-writer
  labels:
    {{- include "podtetris.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "podtetris.fullname" . }}-podmoves-writer
subjects:
  - kind: ServiceAccount
    name: {{ include "podtetris.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
