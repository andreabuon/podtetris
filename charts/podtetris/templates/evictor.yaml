{{- if .Values.evictor.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "podtetris.fullname" . }}-evictor
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: evictor
    {{- include "podtetris.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.evictor.replicas }}
  selector:
    matchLabels:
      {{- include "podtetris.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: evictor
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: evictor
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "podtetris.labels" . | nindent 8 }}
        app.kubernetes.io/component: evictor
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "podtetris.serviceAccountName" . }}
      terminationGracePeriodSeconds: 10
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: podtetris-evictor
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.evictor.image.repository }}:{{ .Values.evictor.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.evictor.image.pullPolicy }}
          args:
            - --health-probe-bind-address={{ .Values.evictor.healthProbeBindAddress }}
            {{- if .Values.evictor.leaderElection }}
            - --leader-elect
            {{- end }}
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.evictor.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
