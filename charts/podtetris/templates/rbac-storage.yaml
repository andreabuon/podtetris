{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "podtetris.fullname" . }}-storage-reader
  labels:
    {{- include "podtetris.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - persistentvolumeclaims
      - persistentvolumes
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources:
      - csinodes
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "podtetris.fullname" . }}-storage-reader
  labels:
    {{- include "podtetris.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "podtetris.fullname" . }}-storage-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "podtetris.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
