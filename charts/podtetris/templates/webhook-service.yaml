apiVersion: v1
kind: Service
metadata:
  name: {{ include "podtetris.fullname" . }}-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "podtetris.labels" . | nindent 4}}
spec:
  type: ClusterIP
  selector:
    app: {{ include "podtetris.fullname" . }}-webhook
  ports:
    - port: 443
      targetPort: 8443