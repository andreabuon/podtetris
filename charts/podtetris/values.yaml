# Default values for podtetris.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Planner CronJob.
# Trigger a run with: `kubectl create job --from=cronjob/<release>-planner <name>`
planner:
  enabled: true
  schedule: "0 0 * * *"
  suspend: true
  image:
    repository: podtetris-planner
    pullPolicy: IfNotPresent
    tag: "latest"
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 600
  # A failed planner run is not retried.
  backoffLimit: 0
  resources:
    limits:
      cpu: "4"
      memory: 4Gi
    requests:
      cpu: "1"
      memory: 1Gi
  config:
    dryRun: false
    # debug, info, warn, error, dpanic, panic, fatal
    logLevel: info
    podtetrisNamespace: "{{ .Release.Namespace }}"
    candidates:
      # candidates.setsToCreate is how many distinct candidate node sets to evaluate per each iteration
      setsToCreate: 3
      # percentOfClusterNodes is the percentage of worker nodes, relative to the whole cluster, to try emptying in each candidate set
      percentOfClusterNodes: 30
      min: 3
      max: 20
      # mix is the percentage of candidate nodes chosen by each strategy (must sum to 100).
      # byCPU and byMemory are rounded down and random gets the remainder.
      # With random set to 0, or when every worker node is a candidate, only a single candidate set is generated, since all sets would be identical.
      mix:
        byCPU: 40
        byMemory: 40
        random: 20
      selectionMaxRetries: 15
    score:
      emptyNodesWeight: 1000
      costWeight: 1
      autoConsolidationThreshold: 0
    permutations:
      enabledStrategies:
        - cpu_desc
        - memory_desc
        - random
      # randomCount is the number of random permutations generated
      randomCount: 5
    parallelism: 8
  # KubeSchedulerConfiguration used by the planner's scoring framework.
  schedulerConfig:
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    profiles:
      - pluginConfig:
          - name: NodeResourcesFit
            args:
              scoringStrategy:
                type: MostAllocated
                resources:
                  - name: cpu
                    weight: 1
                  - name: memory
                    weight: 1
        plugins:
          score:
            enabled:
              - name: NodeResourcesFit
                weight: 500
  # Pod-move costs and fixed-pod rules.
  rules:
    defaultMoveCost: 10
    fixedPodsRules: []
    # - name: pinned-statefulsets
    #   selector:
    #     kinds: [StatefulSet]
    #     namespaces: [db]
    moveCostRules: []
    # - name: databases
    #   cost: 100
    #   selector:
    #     kinds: [StatefulSet]
    #     namespaces: [db]
    #     namespaceRegex: "^db-.*"
    #     nameRegex: "^postgres-.*"
    #     labelSelector:
    #       matchLabels:
    #         tier: database

# Evictor controller (PodMove reconciler).
evictor:
  enabled: true
  replicas: 1
  image:
    repository: podtetris-evictor
    pullPolicy: IfNotPresent
    tag: "latest"
  leaderElection: true
  healthProbeBindAddress: ":8081"
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 250m
      memory: 128Mi

# Mutating admission webhook (pins replacement pods to PodMove.targetNode).
webhook:
  enabled: true
  image:
    repository: podtetris-webhook
    pullPolicy: IfNotPresent
    tag: latest
  replicas: 3
  # dryRun logs matching PodMoves without claiming them or pinning replacement pods.
  dryRun: false
  timeoutSeconds: 5
  failurePolicy: Ignore # 'Ignore', not 'Fail': if the webhook is down, pod creation should not be blocked cluster-wide.
  namespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
          - "{{ .Release.Namespace }}"
          - kube-system
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 250m
      memory: 128Mi

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

rbac:
  create: true

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# Additional volumes (on the planner CronJob and evictor Deployment).
volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

# Additional volumeMounts (on the planner CronJob and evictor Deployment).
volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# cert-manager configuration
certificate:
  issuerGroup: "certmanager.step.sm"
  issuerKind: "StepClusterIssuer"
  issuerName: "step-issuer"
  duration: 2160h # 90 days
  renewBefore: 360h # 15 days
