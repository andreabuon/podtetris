# Kind-only rules overrides
#
# Rules target labs/lab6_kind/manifests/podtetris-test-workloads.yaml.
#
# Fixed pods are not moved by the planner.
#
# Pod moves costs:
# First match wins. Expected move costs when pods are relocated:
#   statefulset-*            → 100  (kinds + nameRegex + labelSelector)
#   rs-a-*                   → 80   (nameRegex)
#   rs-b-*                   → 60   (labelSelector)
#   deployment-a-*           → 40   (labelSelector; controller kind is ReplicaSet)
#   deployment-b-*           → 25   (namespaces exact + labelSelector)
#   anything else in default → 15   (namespaceRegex)
#   elsewhere                → 10   (defaultMoveCost)

planner:
  rules:
    defaultMoveCost: 10
    fixedPodsRules:
      - name: deployment-fixed
        selector:
          labelSelector:
            matchLabels:
              app: fixed-app
    moveCostRules:
      - name: statefulset-nginx
        cost: 100
        selector:
          kinds: [StatefulSet]
          nameRegex: "^statefulset-[0-9]+$"
          labelSelector:
            matchLabels:
              app: nginx

      - name: rs-a-by-name
        cost: 80
        selector:
          nameRegex: "^rs-a-"

      - name: rs-b-by-label
        cost: 60
        selector:
          labelSelector:
            matchLabels:
              app: rs-b

      - name: deployment-a-by-label
        cost: 40
        selector:
          labelSelector:
            matchLabels:
              app: deployment-a

      - name: deployment-b-by-namespace-and-label
        cost: 25
        selector:
          namespaces: [default]
          labelSelector:
            matchLabels:
              app: deployment-b

      - name: default-namespace-regex
        cost: 15
        selector:
          namespaceRegex: "^default$"
