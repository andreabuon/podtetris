apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
spec:
  replicas: 2 # One per zone?
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: redis
        image: redis:alpine
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
      # The database needs to be on a node with fast storage
      nodeSelector:
        disk: nvme
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          # Do not schedule multiple database pods on the same node
          - labelSelector:
              matchLabels:
                app: db
            topologyKey: "kubernetes.io/hostname"
      topologySpreadConstraints:
        - maxSkew: 1
          # Spread the database pods among the different zones
          topologyKey: "zone"
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-server
spec:
  replicas: 4 #2 per zone?
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                - key: disk
                  operator: In
                  values:
                  - ssd
                  - nvme
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
                matchLabels:
                  app: web
            # Do not schedule multiple web server pods on the same node
            topologyKey: "kubernetes.io/hostname"
      topologySpreadConstraints:
        - maxSkew: 1
          # Spread the web servers among the different zones
          topologyKey: "zone"
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-worker
spec:
  replicas: 4 #2 per zone?
  selector:
    matchLabels:
      app: backup
  template:
    metadata:
      labels:
        app: backup
    spec:
      containers:
      - name: busybox
        image: busybox
        command: ["sh", "-c", "sleep 3600"]
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
      nodeSelector:
        disk: hdd
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          # Do not schedule backup workers on the same node as the database pods
          - labelSelector:
              matchLabels:
                app: db
            topologyKey: "kubernetes.io/hostname"
      topologySpreadConstraints:
        - maxSkew: 1
          # Spread the backup workers among the different zones
          topologyKey: "zone"
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: backup