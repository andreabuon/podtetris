apiVersion: v1
kind: Pod
metadata:
  name: database-fast
  labels:
    app: db
spec:
  containers:
  - name: redis
    image: redis:alpine
  nodeSelector:
    disk: nvme
---
apiVersion: v1
kind: Pod
metadata:
  name: web-server-ssd
spec:
  containers:
  - name: nginx
    image: nginx:alpine
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 1
        preference:
          matchExpressions:
          - key: disk
            operator: In
            values:
            - ssd
---
apiVersion: v1
kind: Pod
metadata:
  name: backup-worker
spec:
  containers:
  - name: busybox
    image: busybox
    command: ["sh", "-c", "sleep 3600"]
  nodeSelector:
    disk: hdd
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
          - key: app
            operator: In
            values:
            - db
        topologyKey: "kubernetes.io/hostname"
