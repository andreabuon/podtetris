apiVersion: v1
kind: Namespace
metadata:
  name: podtetris
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: podtetris-config
  namespace: podtetris
data:
  config.yaml: |
    randomCandidateNodesNumber: 3
    byCPUCandidateNodesNumber: 2
    podMoveDefaultCost: 10
    # One emptied node is worth 400 cost points (about 8 typical annotated moves).
    # Cost is subtracted 1:1 so a much cheaper plan can beat one extra empty node.
    emptyNodesScoreWeight: 400
    costScoreWeight: 1
    autoConsolidationScoreThreshold: 0
    candidateNodesSelectionMaxRetries: 15
    fixedPodAnnotation: "podtetris/fixed"
    podMoveCostAnnotation: "podtetris/moveCost"
    enabledPermutationStrategies:
      - cpu_desc
      - memory_desc
      - random
    parallelism: 8