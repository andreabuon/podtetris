# This rule is not used by the project evictor itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to podtetris.io.podtetris.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: evictor
    app.kubernetes.io/managed-by: kustomize
  name: consolidationplan-viewer-role
rules:
- apiGroups:
  - podtetris.io.podtetris.io
  resources:
  - consolidationplans
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - podtetris.io.podtetris.io
  resources:
  - consolidationplans/status
  verbs:
  - get
