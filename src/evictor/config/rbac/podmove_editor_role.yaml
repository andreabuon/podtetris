# This rule is not used by the project evictor itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the podtetris.io.podtetris.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: evictor
    app.kubernetes.io/managed-by: kustomize
  name: podmove-editor-role
rules:
- apiGroups:
  - podtetris.io.podtetris.io
  resources:
  - podmoves
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - podtetris.io.podtetris.io
  resources:
  - podmoves/status
  verbs:
  - get
