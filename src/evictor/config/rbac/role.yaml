---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - podtetris.io.podtetris.io
  resources:
  - podmoves
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - podtetris.io.podtetris.io
  resources:
  - podmoves/finalizers
  verbs:
  - update
- apiGroups:
  - podtetris.io.podtetris.io
  resources:
  - podmoves/status
  verbs:
  - get
  - patch
  - update
