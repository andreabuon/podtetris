# candidateNodesSetsToCreate is how many distinct candidate node sets to evaluate
candidateNodesSetsToCreate: 3
# candidateNodesPercent is the percentage of worker nodes to try emptying in each candidate set
candidateNodesPercent: 20
# candidateNodesMin and candidateNodesMax clamp the resulting node count
# (at least one worker node is always kept out of the candidates)
candidateNodesMin: 2
candidateNodesMax: 20
# candidateNodesMix is the percentage of candidate nodes chosen by each strategy (must sum to 100).
# Without random nodes only a single candidate set is generated, since all sets would be identical.
candidateNodesMix:
  byCPU: 40
  byMemory: 40
  random: 20
emptyNodesScoreWeight: 400
costScoreWeight: 1
autoConsolidationScoreThreshold: 0
candidateNodesSelectionMaxRetries: 15
enabledPermutationStrategies:
  - cpu_desc
  - memory_desc
  - random
# randomPermutationCount is the number of random permutations generated
randomPermutationCount: 1
parallelism: 8
dryRun: false
# debug, info, warn, error, dpanic, panic, fatal
logLevel: info
