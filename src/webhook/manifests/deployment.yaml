apiVersion: v1
kind: Namespace
metadata:
  name: podtetris
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: podtetris-webhook
  namespace: podtetris
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: podtetris-webhook
rules:
  - apiGroups: ["podtetris.io.podtetris.io"]
    resources: ["podmoves"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: podtetris-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: podtetris-webhook
subjects:
  - kind: ServiceAccount
    name: podtetris-webhook
    namespace: podtetris
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podtetris-webhook
  namespace: podtetris
  labels:
    app: podtetris-webhook
spec:
  replicas: 3
  selector:
    matchLabels:
      app: podtetris-webhook
  template:
    metadata:
      labels:
        app: podtetris-webhook
    spec:
      serviceAccountName: podtetris-webhook
      containers:
        - name: webhook
          image: podtetris-webhook:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8443
              name: https
          volumeMounts:
            - name: certs
              mountPath: /etc/webhook/certs
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: certs
          secret:
            secretName: podtetris-webhook-certs
---
apiVersion: v1
kind: Service
metadata:
  name: podtetris-webhook
  namespace: podtetris
spec:
  selector:
    app: podtetris-webhook
  ports:
    - port: 443
      targetPort: 8443