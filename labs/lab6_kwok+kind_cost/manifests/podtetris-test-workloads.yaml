apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app-alpha
  namespace: default
spec:
  replicas: 7
  selector:
    matchLabels:
      app: test-app-alpha
  template:
    metadata:
      labels:
        app: test-app-alpha
      annotations:
        "podtetris/moveCost": "75"
    spec:
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.9
        resources:
          requests:
            cpu: "128m"
            memory: "128Mi"
          limits:
            cpu: "256m"
            memory: "256Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app-beta
  namespace: default
spec:
  replicas: 7
  selector:
    matchLabels:
      app: test-app-beta
  template:
    metadata:
      labels:
        app: test-app-beta
      annotations:
        "podtetris/moveCost": "50"
    spec:
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.9
        resources:
          requests:
            cpu: "100m"
            memory: "100Mi"
          limits:
            cpu: "200m"
            memory: "200Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixed-workload
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fixed-app
  template:
    metadata:
      labels:
        app: fixed-app
      annotations:
        "podtetris/fixed": "true" 
    spec:
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.9
        resources:
          requests:
            cpu: "123m"
            memory: "123Mi"
          limits:
            cpu: "246m"
            memory: "246Mi"
--- # StatefulSet stuff
apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  ports:
  - port: 80
    name: web
  clusterIP: None
  selector:
    app: nginx
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web
spec:
  selector:
    matchLabels:
      app: nginx # has to match .spec.template.metadata.labels
  serviceName: "nginx"
  replicas: 3
  template:
    metadata:
      labels:
        app: nginx # has to match .spec.selector.matchLabels
    spec:
      terminationGracePeriodSeconds: 10
      containers:
      - name: nginx
        image: registry.k8s.io/nginx-slim:0.24
        ports:
        - containerPort: 80
          name: web
        resources:
          requests:
            cpu: 1000m
            memory: 512Mi
          limits:
            cpu: 1500m
            memory: 1024Mi