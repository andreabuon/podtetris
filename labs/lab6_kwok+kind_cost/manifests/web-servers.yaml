apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-server
spec:
  replicas: 4 #2 per zone?
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
      annotations:
        podtetris/fixed: "no"
        podtetris/moveCost: "7"
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"