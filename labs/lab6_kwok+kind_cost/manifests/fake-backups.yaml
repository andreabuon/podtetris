apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backup
  template:
    metadata:
      labels:
        app: backup
      annotations:
        podtetris/fixed: "no"
        podtetris/moveCost: "50"
    spec:
      containers:
      - name: busybox
        image: busybox
        command: ["sh", "-c", "sleep 3600"]
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"