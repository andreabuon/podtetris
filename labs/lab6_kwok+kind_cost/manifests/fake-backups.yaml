apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-worker
spec:
  replicas: 4 #2 per zone?
  selector:
    matchLabels:
      app: backup
  template:
    metadata:
      labels:
        app: backup
      annotations:
        podtetris/fixed: "no"
        podtetris/moveCost: "50"
    spec:
      containers:
      - name: busybox
        image: busybox
        command: ["sh", "-c", "sleep 3600"]
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"
      nodeSelector:
        disk: hdd
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          # Do not schedule backup workers on the same node as the database pods
          - labelSelector:
              matchLabels:
                app: db
            topologyKey: "kubernetes.io/hostname"
      topologySpreadConstraints:
        - maxSkew: 1
          # Spread the backup workers among the different zones
          topologyKey: "topology.kubernetes.io/zone"
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: backup