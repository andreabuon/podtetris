apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-fixed
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fixed-app
  template:
    metadata:
      labels:
        app: fixed-app
      annotations:
        "podtetris/fixed": "true" 
    spec:
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.9
        resources:
          requests:
            cpu: "123m"
            memory: "123Mi"
          limits:
            cpu: "246m"
            memory: "246Mi"
