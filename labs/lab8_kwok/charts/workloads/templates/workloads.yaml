{{- range .Values.workloads }}
{{- $ctx := dict "root" $ "w" . }}
{{- $replicas := include "workloads.replicas" $ctx }}
{{- if eq .kind "StatefulSet" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
  labels:
    app: {{ .name }}
    podtetris.io/benchmark: "true"
spec:
  clusterIP: None
  selector:
    app: {{ .name }}
  ports:
    - name: http
      port: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
  labels:
    app: {{ .name }}
    podtetris.io/benchmark: "true"
spec:
  serviceName: {{ .name }}
  replicas: {{ $replicas }}
  selector:
    matchLabels:
      app: {{ .name }}
  template:
    {{- include "workloads.podTemplate" $ctx | nindent 4 }}
{{- else }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
  labels:
    app: {{ .name }}
    podtetris.io/benchmark: "true"
spec:
  replicas: {{ $replicas }}
  selector:
    matchLabels:
      app: {{ .name }}
  template:
    {{- include "workloads.podTemplate" $ctx | nindent 4 }}
{{- end }}
{{- if .pdb }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: {{ .name }}
{{- end }}
{{- end }}
