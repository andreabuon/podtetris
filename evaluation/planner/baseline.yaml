planner:
  config:
    podtetrisNamespace: "{{ .Release.Namespace }}"
    candidates:
      setsToCreate: 3
      percentOfClusterNodes: 30
      min: 3
      max: 30
      mix:
        byCPU: 30
        byMemory: 30
        random: 40
      selectionMaxRetries: 15
    emptyNodesScoreWeight: 400
    costScoreWeight: 1
    autoConsolidationScoreThreshold: 0
    enabledPermutationStrategies:
      - cpu_desc
      - memory_desc
      - random
    randomPermutationCount: 5
    parallelism: 8
    dryRun: false
    logLevel: info

evictor:
  enabled: false

webhook:
  enabled: false
